<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login - TTD</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><main class="login-box">
<h1>Customer Login</h1><p class="hint">Use the email and password from customers.csv.</p>
<form onsubmit="return customerLogin(event)">
<label for="email">Email</label><input id="email" type="email" placeholder="aarav1@example.com" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" placeholder="TTD@100001" autocomplete="current-password" required>
<button class="btn" type="submit">Login</button><div id="loginMessage"></div>
</form>
<p class="hint"><b>Test:</b> aarav1@example.com / TTD@100001</p><a class="btn" href="index.html">Back</a></main><script src="auth.js"></script></body></html>
